<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur px-6 py-4 sticky top-0 z-10 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold tracking-tight text-teal-400">Classroom Monitor</h1>
            <p class="text-xs text-slate-500">Autonomous Sensor & Face Recognition Attendance</p>
        </div>
        <div class="flex items-center gap-3">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400">
                <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span> System Active
            </span>
            <button onclick="reloadDatabase()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition">Sync Known Faces</button>
        </div>
    </header>

    <main class="p-6 max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- LEFT COLUMN: Live Stream and Simulation -->
        <section class="lg:col-span-5 flex flex-col gap-6">
            <!-- Cam Feed -->
            <div class="bg-slate-950/40 rounded-xl border border-slate-800 overflow-hidden">
                <div class="px-4 py-3 border-b border-slate-800 bg-slate-950/60 flex justify-between items-center">
                    <span class="text-sm font-semibold tracking-wide text-slate-300">Live Camera Stream</span>
                </div>
                <div class="aspect-video bg-slate-900 relative flex items-center justify-center">
                    <img id="feed-img" src="" alt="Camera Feed Offline" class="w-full h-full object-cover">
                </div>
            </div>

            <!-- Manual Simulation -->
            <div class="bg-slate-950/40 rounded-xl border border-slate-800 p-5">
                <h3 class="text-sm font-semibold text-slate-300 mb-3">Simulation Console (Dev Mode)</h3>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="triggerAction('ENTRY')" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-medium text-sm py-2 px-4 rounded-lg transition shadow-lg shadow-teal-500/10">Simulate ENTRY</button>
                    <button onclick="triggerAction('EXIT')" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-medium text-sm py-2 px-4 rounded-lg transition shadow-lg shadow-rose-500/10">Simulate EXIT</button>
                </div>
            </div>

            <!-- Logger console -->
            <div class="bg-slate-950 rounded-xl border border-slate-800 p-4">
                <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Device Log Terminal</h3>
                <div id="log-console" data-last-log="" class="font-mono text-xs text-teal-400 h-32 overflow-y-auto flex flex-col gap-1 pr-2">
                </div>
            </div>
        </section>

        <!-- RIGHT COLUMN: Dashboard Statistics & Logs -->
        <section class="lg:col-span-7 flex flex-col gap-6">
            <!-- Strength Status -->
            <div class="grid grid-cols-3 gap-6">
                <div class="bg-gradient-to-br from-teal-500/10 to-transparent border border-teal-500/20 rounded-xl p-5 col-span-3 flex justify-between items-center">
                    <div>
                        <p class="text-sm text-teal-400 font-semibold uppercase tracking-wider">Current Class Strength</p>
                        <h2 class="text-5xl font-extrabold tracking-tight mt-1 text-slate-100" id="strength-val">0</h2>
                    </div>
                    <div class="flex gap-2">
                        <a href="http://localhost:8000/api/export/present" download class="text-xs bg-slate-800 hover:bg-slate-700 hover:text-teal-400 px-3 py-2 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                            Export Present Sheet
                        </a>
                        <a href="http://localhost:8000/api/export/absent" download class="text-xs bg-slate-800 hover:bg-slate-700 hover:text-rose-400 px-3 py-2 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                            Export Absent Sheet
                        </a>
                    </div>
                </div>
            </div>

            <!-- Attendance Panels -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Present Students Table -->
                <div class="bg-slate-950/40 border border-slate-800 rounded-xl overflow-hidden flex flex-col h-[400px]">
                    <div class="px-4 py-3 border-b border-slate-800 bg-emerald-500/5 flex justify-between items-center shrink-0">
                        <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">Marked Inside Room</span>
                    </div>
                    <div class="overflow-y-auto flex-1">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-950 text-xs text-slate-400 border-b border-slate-800 sticky top-0 z-10">
                                    <th class="px-4 py-2 font-medium">Name</th>
                                    <th class="px-4 py-2 font-medium">Roll No</th>
                                    <th class="px-4 py-2 font-medium">Entered</th>
                                </tr>
                            </thead>
                            <tbody id="present-body">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Absent Students Table -->
                <div class="bg-slate-950/40 border border-slate-800 rounded-xl overflow-hidden flex flex-col h-[400px]">
                    <div class="px-4 py-3 border-b border-slate-800 bg-rose-500/5 flex justify-between items-center shrink-0">
                        <span class="text-xs font-bold uppercase tracking-wider text-rose-400">Absent / Outside</span>
                    </div>
                    <div class="overflow-y-auto flex-1">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-950 text-xs text-slate-400 border-b border-slate-800 sticky top-0 z-10">
                                    <th class="px-4 py-2 font-medium">Name</th>
                                    <th class="px-4 py-2 font-medium">Roll No</th>
                                </tr>
                            </thead>
                            <tbody id="absent-body">
                                <!-- Populated dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
